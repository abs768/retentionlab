[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "0.2.0"
description = "End-to-end retention intelligence with calibrated ML serving and monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "statsmodels==0.14.6",
    "matplotlib==3.9.4",
    "joblib==1.5.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["churnguard", "app"]
package-dir = {churnguard = "src/churnguard", app = "app"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), isort (I), and a few bugbear checks.
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve the existing Python 3.9 analytical implementation unchanged.
"src/churnguard/evaluation.py" = ["B905"]
