name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs the package itself (not just its dependencies), so a broken
      # pyproject or package layout fails CI rather than surfacing later.
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the package imports
        run: python -c "import churnguard; print('churnguard', churnguard.__version__)"

      - name: Lint
        run: ruff check .

      # The full pipeline is not run in CI: it is fast, but its outputs are
      # committed evidence tied to a specific library build, and re-running it
      # on every push would add churn without adding signal. The test suite
      # already exercises every module end to end on the real dataset.
      - name: Run tests
        run: python -m pytest
