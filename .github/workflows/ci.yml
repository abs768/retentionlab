name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/churnguard-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify package and API imports
        run: python -c "import churnguard; from app.main import app; print(app.title)"
      - name: Download and verify data
        run: python scripts/download_data.py
      - name: Lint
        run: ruff check .
      - name: Verify frozen artifact
        run: python scripts/verify_model_artifact.py
      - name: Run tests including API startup and frozen metrics
        run: python -m pytest
      - name: Verify README evidence
        run: python scripts/verify_readme_claims.py

  docker:
    name: Build container and verify serving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t churnguard:ci .
      - name: Verify container endpoints
        run: |
          docker run -d --name churnguard-ci -p 8000:8000 churnguard:ci
          trap 'docker logs churnguard-ci; docker rm -f churnguard-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          python -c 'import json; print(json.dumps(json.load(open("artifacts/model/model_metadata.json"))["smoke_input"]))' > /tmp/customer.json
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/customer.json http://localhost:8000/predict
